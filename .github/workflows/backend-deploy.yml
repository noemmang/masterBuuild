name: Backend - Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: masterbuildregistry.azurecr.io
  IMAGE_NAME: masterbuild-backend
  RESOURCE_GROUP: infrastructure-rg
  CONTAINER_APP: masterbuild-backend
  CONTAINER_JOB: masterbuild-scraping-diario

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build image, push a ACR y desplegar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login en Azure Container Registry
        run: az acr login --name masterbuildregistry

      - name: Build y push de la imagen
        working-directory: backend
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Cada commit a backend/ genera una imagen con el sha del commit
      # como tag (trazabilidad total: sabes qué código corre a partir del
      # tag) y además actualiza "latest". Container App y el Job usan
      # ambos el tag con el sha, no "latest", para que cada despliegue
      # sea explícito y reproducible.

      - name: Actualizar Container App (backend)
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}

      - name: Actualizar Container App Job (scraping diario)
        run: |
          az containerapp job update \
            --name ${{ env.CONTAINER_JOB }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}

      - name: Logout de Azure
        if: always()
        run: az logout